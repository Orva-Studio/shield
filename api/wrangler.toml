name = "shieldtap-api"
main = "src/index.ts"
compatibility_date = "2024-01-01"

[vars]
# Your Cloudflare Access team domain (e.g., https://yourteam.cloudflareaccess.com)
TEAM_DOMAIN = "https://yourteam.cloudflareaccess.com"
# Your Cloudflare Access Application Audience (AUD) tag
POLICY_AUD = "your-policy-aud-here"
# Set to "true" for local development without CF Access (DO NOT deploy with this enabled)
DEV_MODE = "true"

[[d1_databases]]
binding = "DB"
database_name = "shieldtap-db"
database_id = "local-dev-db"
