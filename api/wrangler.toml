name = "shieldtap-api"
main = "src/index.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# Base URL for the auth server (update for production)
BETTER_AUTH_URL = "https://shieldtap-api.richardbray89.workers.dev"
# Set to "true" for local development (DO NOT deploy with this enabled)
DEV_MODE = "false"

# Secrets (use `wrangler secret put` for production):
# - BETTER_AUTH_SECRET: 32+ character secret for encryption

[[d1_databases]]
binding = "DB"
database_name = "shieldtap-db"
database_id = "d256ca3a-5432-49c8-a731-b23ad5d00850"
